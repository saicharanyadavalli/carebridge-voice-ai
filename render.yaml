services:
  - type: web
    name: carebridge-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    region: singapore
    envVars:
      - key: LLM_PROVIDER
        value: auto
      - key: APP_LANGUAGE
        value: en
      - key: ALLOWED_ORIGINS
        value: "*"
